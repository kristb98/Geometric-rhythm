<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A Geometry Dash-inspired rhythm platformer game">
    <meta name="theme-color" content="#0a0a0a">
    <title>Geometric Rhythm</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='6'%20fill='%230a0a0a'/%3E%3Cpath%20d='M16%204%20L28%2016%20L16%2028%20L4%2016%20Z'%20fill='%2300f3ff'/%3E%3Cpath%20d='M16%209%20L23%2016%20L16%2023%20L9%2016%20Z'%20fill='%2339ff14'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="stylesheet" href="frame.css?v=2">
    <link rel="stylesheet" href="ui.css?v=2">
</head>
<body>
    <div class="room">
        <figure class="frame">
            <div class="frame__moulding">
                <div class="frame__mat">
                    <div id="game-container">
                        <canvas id="gameCanvas"></canvas>

                        <div id="hud">
                            <div id="progress-container">
                                <div id="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                            <div class="hud__bar">
                                <div id="score" aria-label="Level progress">0%</div>
                                <button id="mute-btn" type="button" title="Mute music" aria-pressed="false">MUSIC: ON</button>
                            </div>
                        </div>

                        <!-- Main menu -->
                        <div id="main-menu" class="overlay">
                            <div class="mm">
                                <div class="mm__lead">
                                    <p class="eyebrow">Rhythm platformer · browser arcade</p>
                                    <h1 class="mm__title">GEOMETRIC <span>RHYTHM</span></h1>
                                    <p class="mm__tag">One button. One beat. Six levels of neon spikes built to be replayed until the run is clean.</p>
                                    <button id="play-btn" class="btn btn--primary" type="button">PLAY</button>
                                    <p class="mm__hint">
                                        <kbd>Space</kbd><kbd>Click</kbd><kbd>Tap</kbd>
                                        <span>to jump</span>
                                    </p>
                                </div>

                                <aside class="mm__panel" aria-label="Song and loadout">
                                    <div class="mm__panel-head">
                                        <span class="mm__panel-label">Loadout</span>
                                        <div class="currency-display">♥ 0 &nbsp;◆ 0</div>
                                    </div>

                                    <div class="song-selector-row">
                                        <label for="song-selector">SONG</label>
                                        <select id="song-selector"></select>
                                    </div>

                                    <div class="menu-buttons menu-buttons--stack">
                                        <button id="customize-btn" type="button">CUSTOMIZE</button>
                                        <button id="shop-btn" type="button">SHOP</button>
                                    </div>

                                    <p class="mm__note">Progress saves in this browser.</p>
                                </aside>
                            </div>
                        </div>

                        <!-- Level select -->
                        <div id="level-menu" class="overlay hidden">
                            <div class="screen-head">
                                <button id="exit-levels-btn" class="btn btn--ghost" type="button">&larr; MENU</button>
                                <div class="screen-head__title">
                                    <p class="eyebrow">Campaign</p>
                                    <h1>SELECT LEVEL</h1>
                                </div>
                                <div class="currency-display">♥ 0 &nbsp;◆ 0</div>
                            </div>
                            <div id="level-grid" class="screen-body"></div>
                        </div>

                        <!-- Customize -->
                        <div id="customize-menu" class="overlay hidden">
                            <div class="screen-head">
                                <button id="customize-back-btn" class="btn btn--ghost" type="button">&larr; BACK</button>
                                <div class="screen-head__title">
                                    <p class="eyebrow">Loadout</p>
                                    <h1>CUSTOMIZE</h1>
                                </div>
                                <div class="currency-display">♥ 0 &nbsp;◆ 0</div>
                            </div>
                            <div class="customize-tabs" id="customize-tabs"></div>
                            <div id="customize-grid" class="screen-body"></div>
                        </div>

                        <!-- Shop -->
                        <div id="shop-menu" class="overlay hidden">
                            <div class="screen-head">
                                <button id="shop-back-btn" class="btn btn--ghost" type="button">&larr; BACK</button>
                                <div class="screen-head__title">
                                    <p class="eyebrow">Spend your orbs</p>
                                    <h1>SHOP</h1>
                                </div>
                                <div class="currency-display">♥ 0 &nbsp;◆ 0</div>
                            </div>
                            <div class="customize-tabs" id="shop-tabs"></div>
                            <div id="shop-grid" class="screen-body"></div>
                        </div>

                        <!-- Run ended -->
                        <div id="game-over" class="overlay overlay--result hidden">
                            <div class="panel panel--result">
                                <p class="eyebrow eyebrow--danger">Run ended</p>
                                <h2 id="death-msg">TRY AGAIN</h2>
                                <div id="attempt-display">ATTEMPT 1</div>
                                <div class="menu-buttons">
                                    <button id="restart-btn" class="btn btn--primary" type="button">REPLAY</button>
                                    <button id="menu-btn" class="btn btn--ghost" type="button">LEVELS</button>
                                </div>
                                <button id="feedback-btn" class="link-btn" type="button">Suggestions, feedback &amp; more</button>
                            </div>
                        </div>

                        <!-- Level complete -->
                        <div id="level-complete" class="overlay overlay--result hidden">
                            <div class="panel panel--result">
                                <p class="eyebrow eyebrow--success">Level clear</p>
                                <h2>LEVEL COMPLETE!</h2>
                                <div id="complete-stars"></div>
                                <div id="complete-progress">100%</div>
                                <div id="complete-unlock" class="sub-note"></div>
                                <div class="menu-buttons">
                                    <button id="complete-replay-btn" class="btn btn--primary" type="button">REPLAY</button>
                                    <button id="complete-menu-btn" class="btn btn--ghost" type="button">LEVELS</button>
                                </div>
                            </div>
                        </div>

                        <!-- Feedback -->
                        <div id="feedback-overlay" class="overlay overlay--result hidden">
                            <div class="panel panel--result feedback-panel">
                                <p class="eyebrow">Feedback</p>
                                <h2>SUGGESTIONS &amp; REPORTS</h2>
                                <p class="feedback-note">Tell me what broke, what confused you, or what you'd love to see next. The form opens in a new tab.</p>
                                <a class="btn btn--primary feedback-open" href="https://docs.google.com/forms/d/e/1FAIpQLSfHtF4FDY2DHXI8NNPhvM4j6tvYzHIWeBlbGw7Aly58lAXVkA/viewform" target="_blank" rel="noopener">OPEN THE FORM &#8599;</a>
                                <button id="feedback-close-btn" class="link-btn" type="button">Close</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <figcaption class="plaque">
                <span class="plaque__title">GEOMETRIC RHYTHM</span>
                <span class="plaque__meta">A neon rhythm platformer · play in the browser</span>
            </figcaption>
        </figure>
    </div>

    <div id="flash-msg" class="hidden" role="status" aria-live="polite"></div>

    <audio id="bg-music" loop preload="auto"></audio>

    <script src="levelData.js?v=2"></script>
    <script src="game.js?v=3"></script>
</body>
</html>
